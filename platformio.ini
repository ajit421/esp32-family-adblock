[platformio]
default_envs = esp32dev          ; this setup's board (classic ESP32); build the C3 with -e c3

[env]
; Pinned: firmware uses ~92% of the 0x150000 OTA slot, and a newer core can silently grow it past the slot.
platform = platformio/espressif32 @ 8.0.0
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
monitor_speed = 115200

[env:esp32dev]
board = esp32dev

[env:c3]
; NOTE: since the 2026-10-22 changes this build is ~23 KB larger than the 0x150000 OTA slot (PlatformIO
; still reports SUCCESS). It is kept for reference; the supported target is esp32dev.
board = esp32-c3-devkitm-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
